<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Theja K V - Timetable Viewer</title>
    <!-- Google Fonts for a premium look -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0b0e;
            --card-bg: #13161c;
            --border-color: #222632;
            --gold: #f3c653;
            --gold-glow: rgba(243, 198, 83, 0.15);
            --text-main: #f0f2f5;
            --text-muted: #94a3b8;
            --success-bg: rgba(16, 185, 129, 0.12);
            --success-border: #10b981;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            margin: 0;
            background: linear-gradient(135deg, #fff 30%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.8rem;
            letter-spacing: 0.5px;
        }

        header p {
            margin: 6px 0 0;
            color: var(--text-muted);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .live-status {
            border-left: 4px solid var(--success-border);
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, var(--card-bg) 100%);
        }

        /* Modern Pill Selector */
        .selector-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: block;
        }

        .day-pills {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        .day-pill {
            background: #1a1e26;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 0;
            text-align: center;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .day-pill:hover {
            border-color: var(--gold);
            color: var(--text-main);
        }

        .day-pill.active {
            background: linear-gradient(135deg, #2a2211 0%, #1a1e26 100%);
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: 0 0 12px var(--gold-glow);
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        th {
            background-color: #1a1e26;
            color: var(--gold);
            font-weight: 600;
        }

        /* Highlighted Column & Active Cell */
        .highlighted-column {
            background-color: var(--gold-glow) !important;
            border-color: rgba(243, 198, 83, 0.3) !important;
        }

        td.active-class-cell {
            background-color: rgba(243, 198, 83, 0.25) !important;
            border: 2px solid var(--gold) !important;
            color: var(--gold);
            font-weight: 700;
            box-shadow: inset 0 0 10px var(--gold-glow);
        }

        .free-slot {
            color: #4a5568;
            font-style: italic;
        }

        /* Daily List */
        .daily-list {
            list-style: none;
            padding: 0;
            margin: 5px 0 0 0;
        }

        .daily-list li {
            padding: 10px 4px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .daily-list li:last-child {
            border-bottom: none;
        }

        .gold-text {
            color: var(--gold);
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .day-pills {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Mr. Theja K V</h1>
        <p>Faculty Timetable Portal</p>
    </header>

    <!-- Modern Day Order Selector Pills -->
    <div class="card">
        <span class="selector-label">Active Day Order</span>
        <div class="day-pills" id="dayPillsContainer">
            <div class="day-pill" onclick="selectDay('1')">I</div>
            <div class="day-pill" onclick="selectDay('2')">II</div>
            <div class="day-pill" onclick="selectDay('3')">III</div>
            <div class="day-pill" onclick="selectDay('4')">IV</div>
            <div class="day-pill" onclick="selectDay('5')">V</div>
            <div class="day-pill" onclick="selectDay('6')">VI</div>
        </div>
    </div>

    <!-- Master Timetable Grid View -->
    <div class="card">
        <h3 style="margin-top:0; color: var(--gold); font-size: 1.1rem;">Master Overview</h3>
        <table id="masterTable">
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Hour I<br><small style="color:var(--text-muted)">8:30-9:25</small></th>
                    <th>Hour II<br><small style="color:var(--text-muted)">9:25-10:20</small></th>
                    <th>Hour III<br><small style="color:var(--text-muted)">10:20-11:15</small></th>
                    <th>Hour IV<br><small style="color:var(--text-muted)">11:35-12:30</small></th>
                    <th>Hour V<br><small style="color:var(--text-muted)">12:30-1:25</small></th>
                </tr>
            </thead>
            <tbody id="masterTableBody">
                <!-- Populated by script -->
            </tbody>
        </table>
    </div>

    <!-- Live Status Card -->
    <div class="card live-status" id="liveCard">
        <h3 style="margin-top:0; color: #10b981; font-size: 1.1rem;">Live Status</h3>
        <p id="liveStatusText" style="margin-bottom:0; line-height: 1.5;">Initializing...</p>
    </div>

    <!-- Selected Day Order Specific View -->
    <div class="card">
        <h3 id="selectedDayTitle" style="margin-top:0; color: var(--gold); font-size: 1.1rem;">Schedule</h3>
        <ul class="daily-list" id="selectedDayList">
            <!-- Populated by script -->
        </ul>
    </div>
</div>

<script>
    const timeSlots = [
        { hourKey: "I", timeStr: "08:30 - 09:25", start: 830, end: 925 },
        { hourKey: "II", timeStr: "09:25 - 10:20", start: 925, end: 1020 },
        { hourKey: "III", timeStr: "10:20 - 11:15", start: 1020, end: 1115 },
        { hourKey: "IV", timeStr: "11:35 - 12:30", start: 1135, end: 1230 },
        { hourKey: "V", timeStr: "12:30 - 13:25", start: 1230, end: 1325 }
    ];

    const masterTimetable = {
        "1": { "I": "Free", "II": "II BMS + STAT + BM", "III": "II CS C", "IV": "Free", "V": "Free" },
        "2": { "I": "Free", "II": "II CS C", "III": "I AVI", "IV": "Free", "V": "II BMS + STAT + BM" },
        "3": { "I": "II CS C", "II": "Free", "III": "II BMS + STAT + BM", "IV": "Free", "V": "I AVI" },
        "4": { "I": "I IT + DS", "II": "Free", "III": "Free", "IV": "II STAT + BM", "V": "II DS" },
        "5": { "I": "Free", "II": "I STAT + BMS + BM", "III": "Free", "IV": "I IT + DS", "V": "II BMS + STAT + BM" },
        "6": { "I": "II BMS + STAT + BM", "II": "Free", "III": "II CS C", "IV": "Free", "V": "II DS" }
    };

    let activeDay = "1";

    function initApp() {
        const todayStr = new Date().toDateString();
        const savedDate = localStorage.getItem("theja_timetable_date");
        let savedDay = localStorage.getItem("theja_timetable_day");

        if (savedDate !== todayStr) {
            if (savedDay) {
                savedDay = ((parseInt(savedDay) % 6) + 1).toString();
            } else {
                savedDay = "1";
            }
            localStorage.setItem("theja_timetable_date", todayStr);
            localStorage.setItem("theja_timetable_day", savedDay);
        } else if (!savedDay) {
            savedDay = "1";
            localStorage.setItem("theja_timetable_day", savedDay);
        }

        activeDay = savedDay;
        renderApp();
    }

    function selectDay(dayStr) {
        activeDay = dayStr;
        localStorage.setItem("theja_timetable_day", activeDay);
        localStorage.setItem("theja_timetable_date", new Date().toDateString());
        renderApp();
    }

    function renderApp() {
        // Update Pill UI classes
        const pills = document.querySelectorAll('.day-pill');
        pills.forEach((pill, idx) => {
            if ((idx + 1).toString() === activeDay) {
                pill.classList.add('active');
            } else {
                pill.classList.remove('active');
            }
        });

        const currentMinutes = getCurrentMinutes();

        // 1. Render Master Table
        const tbody = document.getElementById("masterTableBody");
        tbody.innerHTML = "";

        for (let day = 1; day <= 6; day++) {
            const dayStr = day.toString();
            const row = document.createElement("tr");
            const isSelectedRow = (dayStr === activeDay);

            let rowHTML = `<td><strong>Day ${convertToRoman(dayStr)}</strong></td>`;

            timeSlots.forEach(slot => {
                const course = masterTimetable[dayStr][slot.hourKey];
                const isFree = course === "Free";
                
                let cellClass = "";
                if (isSelectedRow) {
                    cellClass += " highlighted-column";
                }
                if (isSelectedRow && isCurrentSlot(slot, currentMinutes)) {
                    cellClass += " active-class-cell";
                }

                rowHTML += `<td class="${cellClass.trim()} ${isFree ? 'free-slot' : ''}">${course}</td>`;
            });

            row.innerHTML = rowHTML;
            tbody.appendChild(row);
        }

        // 2. Render List View
        document.getElementById("selectedDayTitle").innerText = `Day Order ${convertToRoman(activeDay)} Schedule`;
        const listContainer = document.getElementById("selectedDayList");
        listContainer.innerHTML = "";

        const dailyData = masterTimetable[activeDay];
        timeSlots.forEach(slot => {
            const course = dailyData[slot.hourKey];
            const li = document.createElement("li");
            li.innerHTML = `<span><strong>Hour ${slot.hourKey}</strong> <small style="color:var(--text-muted)">(${slot.timeStr})</small></span> <span class="${course === 'Free' ? 'free-slot' : 'gold-text'}">${course}</span>`;
            listContainer.appendChild(li);
        });

        // 3. Live Status
        updateLiveStatus(dailyData, currentMinutes);
    }

    function getCurrentMinutes() {
        const now = new Date();
        return now.getHours() * 100 + now.getMinutes();
    }

    function isCurrentSlot(slot, currentMinutes) {
        return currentMinutes >= slot.start && currentMinutes <= slot.end;
    }

    function updateLiveStatus(dailyData, currentMinutes) {
        const liveText = document.getElementById("liveStatusText");
        let activeSlot = null;
        let nextClassSlot = null;

        for (let slot of timeSlots) {
            if (isCurrentSlot(slot, currentMinutes)) {
                activeSlot = slot;
                break;
            }
        }

        for (let slot of timeSlots) {
            if (slot.start > currentMinutes) {
                if (dailyData[slot.hourKey] !== "Free") {
                    nextClassSlot = slot;
                    break;
                }
            }
        }

        if (activeSlot) {
            const course = dailyData[activeSlot.hourKey];
            if (course === "Free") {
                liveText.innerHTML = `Currently (Hour ${activeSlot.hourKey} - ${activeSlot.timeStr}): <span style="color:var(--text-muted)">Free Hour</span>`;
                if (nextClassSlot) {
                    liveText.innerHTML += `<br>Next Class: <strong>Hour ${nextClassSlot.hourKey}</strong> (${nextClassSlot.timeStr}) — <span class="gold-text">${dailyData[nextClassSlot.hourKey]}</span>`;
                }
            } else {
                liveText.innerHTML = `Ongoing Class (Hour ${activeSlot.hourKey} - ${activeSlot.timeStr}): <span class="gold-text" style="font-size:1.05rem;">${course}</span>`;
            }
        } else if (nextClassSlot) {
            const course = dailyData[nextClassSlot.hourKey];
            liveText.innerHTML = `No class right now. Your next class is <strong>Hour ${nextClassSlot.hourKey}</strong> (${nextClassSlot.timeStr}) — <span class="gold-text">${course}</span>`;
        } else {
            liveText.innerHTML = `No more teaching classes scheduled for today.`;
        }
    }

    function convertToRoman(num) {
        const romans = { "1": "I", "2": "II", "3": "III", "4": "IV", "5": "V", "6": "VI" };
        return romans[num] || num;
    }

    initApp();
    setInterval(renderApp, 60000);
</script>

</body>
</html>
