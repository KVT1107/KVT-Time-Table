<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Theja K V - Timetable Viewer</title>
    <style>
        :root {
            --primary: #0056b3;
            --success: #28a745;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #333333;
            --muted: #6c757d;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 850px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            margin: 0;
            color: var(--primary);
            font-size: 1.5rem;
        }
        header p {
            margin: 5px 0 0;
            color: var(--muted);
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            overflow-x: auto;
        }
        .live-status {
            border-left: 5px solid var(--success);
            background: #e9f7ef;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ced4da;
            font-size: 1rem;
            background: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        th, td {
            padding: 10px;
            text-align: center;
            border: 1px solid #dee2e6;
        }
        th {
            background-color: #f8f9fa;
            color: var(--primary);
        }
        .highlighted-column {
            background-color: rgba(40, 167, 69, 0.12) !important;
        }
        td.active-class-cell {
            background-color: rgba(40, 167, 69, 0.3) !important;
            font-weight: bold;
            border: 2px solid var(--success);
        }
        .free-slot {
            color: var(--muted);
            font-style: italic;
        }
        .daily-list {
            list-style: none;
            padding: 0;
            margin: 10px 0 0 0;
        }
        .daily-list li {
            padding: 8px 10px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
        }
        .daily-list li:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Mr. Theja K V</h1>
        <p>Faculty Master Timetable</p>
    </header>

    <!-- Day Order Selection -->
    <div class="card">
        <label for="dayOrderSelect">Select Active Day Order:</label>
        <select id="dayOrderSelect" onchange="handleDayChange()">
            <option value="1">Day Order I</option>
            <option value="2">Day Order II</option>
            <option value="3">Day Order III</option>
            <option value="4">Day Order IV</option>
            <option value="5">Day Order V</option>
            <option value="6">Day Order VI</option>
        </select>
    </div>

    <!-- Master Timetable Grid View -->
    <div class="card">
        <h3 style="margin-top:0;">Master Timetable Overview</h3>
        <table id="masterTable">
            <thead>
                <tr>
                    <th>Day Order</th>
                    <th>Hour I<br><small>8:30 - 9:25</small></th>
                    <th>Hour II<br><small>9:25 - 10:20</small></th>
                    <th>Hour III<br><small>10:20 - 11:15</small></th>
                    <th>Hour IV<br><small>11:35 - 12:30</small></th>
                    <th>Hour V<br><small>12:30 - 1:25</small></th>
                </tr>
            </thead>
            <tbody id="masterTableBody">
                <!-- Dynamically populated -->
            </tbody>
        </table>
    </div>

    <!-- Live Status & Selected Day Order Specific View -->
    <div class="card live-status" id="liveCard">
        <h3>Live Status</h3>
        <p id="liveStatusText">Initializing...</p>
    </div>

    <div class="card">
        <h3 id="selectedDayTitle" style="margin-top:0;">Selected Day Order Schedule</h3>
        <ul class="daily-list" id="selectedDayList">
            <!-- Dynamically populated -->
        </ul>
    </div>
</div>

<script>
    const timeSlots = [
        { hourKey: "I", timeStr: "08:30 - 09:25", start: 830, end: 925 },
        { hourKey: "II", timeStr: "09:25 - 10:20", start: 925, end: 1020 },
        { hourKey: "III", timeStr: "10:20 - 11:15", start: 1020, end: 1115 },
        { hourKey: "IV", timeStr: "11:35 - 12:30", start: 1135, end: 1230 },
        { hourKey: "V", timeStr: "12:30 - 13:25", start: 1230, end: 1325 }
    ];

    const masterTimetable = {
        "1": { "I": "Free", "II": "II BMS + STAT + BM", "III": "II CS C", "IV": "Free", "V": "Free" },
        "2": { "I": "Free", "II": "II CS C", "III": "I AVI", "IV": "Free", "V": "II BMS + STAT + BM" },
        "3": { "I": "II CS C", "II": "Free", "III": "II BMS + STAT + BM", "IV": "Free", "V": "I AVI" },
        "4": { "I": "I IT + DS", "II": "Free", "III": "Free", "IV": "II STAT + BM", "V": "II DS" },
        "5": { "I": "Free", "II": "I STAT + BMS + BM", "III": "Free", "IV": "I IT + DS", "V": "II BMS + STAT + BM" },
        "6": { "I": "II BMS + STAT + BM", "II": "Free", "III": "II CS C", "IV": "Free", "V": "II DS" }
    };

    function initApp() {
        const todayStr = new Date().toDateString();
        const savedDate = localStorage.getItem("theja_timetable_date");
        let savedDay = localStorage.getItem("theja_timetable_day");

        if (savedDate !== todayStr) {
            // New day detected! Increment day order automatically (1 to 6 loop)
            if (savedDay) {
                let nextDay = (parseInt(savedDay) % 6) + 1;
                savedDay = nextDay.toString();
            } else {
                savedDay = "1";
            }
            localStorage.setItem("theja_timetable_date", todayStr);
            localStorage.setItem("theja_timetable_day", savedDay);
        } else if (!savedDay) {
            savedDay = "1";
            localStorage.setItem("theja_timetable_day", savedDay);
        }

        document.getElementById("dayOrderSelect").value = savedDay;
        renderApp();
    }

    function handleDayChange() {
        const selectedDay = document.getElementById("dayOrderSelect").value;
        localStorage.setItem("theja_timetable_day", selectedDay);
        localStorage.setItem("theja_timetable_date", new Date().toDateString()); // lock date sync on manual override
        renderApp();
    }

    function renderApp() {
        const selectedDay = document.getElementById("dayOrderSelect").value;
        const currentMinutes = getCurrentMinutes();

        // 1. Render Master Timetable Table with column & active-cell highlights
        const tbody = document.getElementById("masterTableBody");
        tbody.innerHTML = "";

        for (let day = 1; day <= 6; day++) {
            const dayStr = day.toString();
            const row = document.createElement("tr");
            const isSelectedRow = (dayStr === selectedDay);

            let rowHTML = `<td><strong>Day ${convertToRoman(dayStr)}</strong></td>`;

            timeSlots.forEach((slot, index) => {
                const course = masterTimetable[dayStr][slot.hourKey];
                const isFree = course === "Free";
                
                let cellClass = "";
                if (isSelectedRow) {
                    cellClass += " highlighted-column";
                }
                
                if (isSelectedRow && isCurrentSlot(slot, currentMinutes)) {
                    cellClass += " active-class-cell";
                }

                rowHTML += `<td class="${cellClass.trim()} ${isFree ? 'free-slot' : ''}">${course}</td>`;
            });

            row.innerHTML = rowHTML;
            tbody.appendChild(row);
        }

        // 2. Render Selected Day Order Specific List below
        document.getElementById("selectedDayTitle").innerText = `Classes for Day Order ${convertToRoman(selectedDay)}`;
        
        const listContainer = document.getElementById("selectedDayList");
        listContainer.innerHTML = "";

        const dailyData = masterTimetable[selectedDay];
        timeSlots.forEach(slot => {
            const course = dailyData[slot.hourKey];
            const li = document.createElement("li");
            li.innerHTML = `<span><strong>Hour ${slot.hourKey}</strong> (${slot.timeStr})</span> <span class="${course === 'Free' ? 'free-slot' : ''}">${course}</span>`;
            listContainer.appendChild(li);
        });

        // 3. Update Live Status Card
        updateLiveStatus(dailyData, currentMinutes);
    }

    function getCurrentMinutes() {
        const now = new Date();
        return now.getHours() * 100 + now.getMinutes();
    }

    function isCurrentSlot(slot, currentMinutes) {
        return currentMinutes >= slot.start && currentMinutes <= slot.end;
    }

    function updateLiveStatus(dailyData, currentMinutes) {
        const liveText = document.getElementById("liveStatusText");
        let activeSlot = null;
        let nextClassSlot = null;

        for (let slot of timeSlots) {
            if (isCurrentSlot(slot, currentMinutes)) {
                activeSlot = slot;
                break;
            }
        }

        // Find the next upcoming actual teaching class (skipping free hours)
        for (let slot of timeSlots) {
            if (slot.start > currentMinutes) {
                if (dailyData[slot.hourKey] !== "Free") {
                    nextClassSlot = slot;
                    break;
                }
            }
        }

        if (activeSlot) {
            const course = dailyData[activeSlot.hourKey];
            if (course === "Free") {
                liveText.innerHTML = `Currently (Hour ${activeSlot.hourKey} - ${activeSlot.timeStr}): <strong>Free Hour</strong>`;
                if (nextClassSlot) {
                    liveText.innerHTML += `<br>Next Class: <strong>Hour ${nextClassSlot.hourKey}</strong> (${nextClassSlot.timeStr}) - <span style="color:var(--primary);">${dailyData[nextClassSlot.hourKey]}</span>`;
                }
            } else {
                liveText.innerHTML = `Ongoing Class (Hour ${activeSlot.hourKey} - ${activeSlot.timeStr}): <strong style="color:var(--primary);">${course}</strong>`;
            }
        } else if (nextClassSlot) {
            const course = dailyData[nextClassSlot.hourKey];
            liveText.innerHTML = `No class right now. Your next class is <strong>Hour ${nextClassSlot.hourKey}</strong> (${nextClassSlot.timeStr}): <span style="color:var(--primary);">${course}</span>`;
        } else {
            liveText.innerHTML = `No more teaching classes scheduled for today.`;
        }
    }

    function convertToRoman(num) {
        const romans = { "1": "I", "2": "II", "3": "III", "4": "IV", "5": "V", "6": "VI" };
        return romans[num] || num;
    }

    // Initialize on load and refresh status every minute
    initApp();
    setInterval(renderApp, 60000);
</script>

</body>
</html>
